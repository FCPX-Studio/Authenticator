services:
  authenticator:
    container_name: authenticator
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    # Serve HTTPS directly with a self-signed cert (see README for generating ./certs)
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --ssl-certfile=/app/certs/cert.pem
      - --ssl-keyfile=/app/certs/key.pem
    volumes:
      - ./certs:/app/certs:ro
    ports:
      - "443:8000"
    networks:
      - internal-db-network

networks:
  internal-db-network:
    external: true
