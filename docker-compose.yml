services:
  authenticator:
    container_name: authenticator
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    # Plain HTTP on 8000, only reachable by Caddy (no published ports)
    restart: unless-stopped
    networks:
      - internal-db-network
      - web

  # Public entrypoint: HTTPS with Let's Encrypt certificates (see Caddyfile)
  caddy:
    container_name: caddy
    image: caddy:2.10
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    # The host's resolver (systemd-resolved, 127.0.0.53) is unreachable from
    # inside the container, so use public resolvers to reach Let's Encrypt.
    dns:
      - 213.186.33.99 # OVH
      - 1.1.1.1
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Must persist: holds certificates and ACME account (avoids rate limits)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - authenticator
    restart: unless-stopped
    networks:
      - web

networks:
  internal-db-network:
    external: true
  web:

volumes:
  caddy_data:
  caddy_config:
