services:
  authenticator:
    container_name: authenticator
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    ports:
      - "8000:8000"
    networks:
      - internal-db-network

networks:
  internal-db-network:
    external: true